name: qring_sdk
description: Flutter plugin wrapping the QC Wireless smart-ring SDK (Android AAR 1.0.0.60, iOS QCBandSDK 1.0.0.20260812).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ca.alvi.qring.qring_sdk
        pluginClass: QringSdkPlugin
      ios:
        pluginClass: QringSdkPlugin
